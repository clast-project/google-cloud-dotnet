name: Clast CI

# Build + test Google.Cloud.Storage.V1. It references the ported gax-dotnet + google-api-dotnet-client via cross-repo
# ProjectReferences (checked out as siblings; taken from the PR's same-named branch if present, else main) and, for
# its test project only, the published Google.* helper stack from NuGet. Tests run with the Clast flag OFF, which
# keeps the original assembly identity so the test project's published-package dependencies (Iam.v1, Gax.Testing,
# gRPC, etc.) don't collide with the closure. net8.0 on all OSes; net462 on Windows.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout google-cloud-dotnet
        uses: actions/checkout@v6
        with:
          path: google-cloud-dotnet

      - name: Resolve dependency refs
        id: dep
        shell: bash
        run: |
          HEAD="${{ github.head_ref }}"
          resolve() {
            local repo="$1" ref="main"
            if [ -n "$HEAD" ] && git ls-remote --exit-code --heads \
              "https://github.com/clast-project/$repo.git" "$HEAD" >/dev/null 2>&1; then
              ref="$HEAD"
            fi
            echo "$ref"
          }
          GAX=$(resolve gax-dotnet)
          GAPI=$(resolve google-api-dotnet-client)
          echo "gax=$GAX" >> "$GITHUB_OUTPUT"
          echo "gapi=$GAPI" >> "$GITHUB_OUTPUT"
          echo "Using gax-dotnet@$GAX, google-api-dotnet-client@$GAPI"

      - name: Checkout gax-dotnet (dependency, as sibling)
        uses: actions/checkout@v6
        with:
          repository: clast-project/gax-dotnet
          ref: ${{ steps.dep.outputs.gax }}
          path: gax-dotnet

      - name: Checkout google-api-dotnet-client (dependency, as sibling)
        uses: actions/checkout@v6
        with:
          repository: clast-project/google-api-dotnet-client
          ref: ${{ steps.dep.outputs.gapi }}
          path: google-api-dotnet-client

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        shell: bash
        working-directory: google-cloud-dotnet
        run: dotnet test apis/Google.Cloud.Storage.V1/Google.Cloud.Storage.V1.Tests/Google.Cloud.Storage.V1.Tests.csproj -c Release
